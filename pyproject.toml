[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "sparsehydro-viewer"
dynamic = ["version"]
description = "Desktop workbench for building, calibrating and comparing sparsehydro models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{ name = "sparsehydro contributors" }]
keywords = ["hydrology", "unit hydrograph", "rdii", "calibration", "pareto", "qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "sparsehydro>=1.0.0b1",  # hours-based unit hydrographs, registries, load_extensions()
    "PySide6-Essentials>=6.7",
    "pyqtgraph>=0.13.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
report = ["plotly>=5.0"]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]
docs = ["sphinx>=7", "pydata-sphinx-theme>=0.15", "myst-parser>=3"]
freeze = ["pyinstaller>=6.6"]

[project.gui-scripts]
sparsehydro-viewer = "sparsehydro_viewer.__main__:main"

[project.urls]
Homepage = "https://github.com/CoC-MSD/sparsehydro.viewer"
Issues = "https://github.com/CoC-MSD/sparsehydro.viewer/issues"
Library = "https://github.com/CoC-MSD/SparseHydro"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/sparsehydro_viewer"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "packaging", "README.md", "CHANGELOG.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
qt_api = "pyside6"
markers = ["slow: runs a real optimizer or a subprocess"]
filterwarnings = ["ignore::DeprecationWarning:pyqtgraph.*"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM105", "SIM118"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
packages = ["sparsehydro_viewer.core"]
mypy_path = "src"
